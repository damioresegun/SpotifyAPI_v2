<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Spotify Playlist Helper</title>
        <style>
            body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                max-width: 700px;
                margin: 2rem auto;
                padding: 0 1rem;
                background: #111827;
                color: #e5e7eb;
            }
            h1 {
                font-size: 1.8rem;
                margin-bottom: 0.5rem;
            }
            p {
                margin-bottom: 1.5rem;
                color: #9ca3af;
            }
            button {
                padding: 0.6rem 1rem;
                margin-right: 0.5rem;
                margin-bottom: 0.5rem;
                border-radius: 0.4rem;
                border: none;
                cursor: pointer;
                font-size: 0.95rem;
            }
            .primary {
                background: #22c55e;
                color: #022c22;
                font-weight: 600;
            }
            .secondary {
                background: #1f2933;
                color: #e5e7eb;
                border: 1px solid #374151;
            }
            #output {
                margin-top: 1.5rem;
                padding: 1rem;
                background: #020617;
                border-radius: 0.4rem;
                border: 1px solid #374151;
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
                font-size: 0.85rem;
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body>
        <h1>Spotify Playlist Helper</h1>
        <p>
            This is your local desktop app shell. Next is to wire buttons to real Python playlist function
        </p>

        <div>
            <button id="btnStatus" class="secondary">Check backend status</button>
            <!-- buttons to create later-->
            <button id="btnLogin" class="primary">Log in with Spotify</button>
            <button id="btnMonthly" class="secondary">Create monthly playlist</button>
        </div>

        <div id="output">Click "Check backend status" to test the connection...</div>

        <script>
            const output = document.getElementById("output");

            async function callStatus() {
                output.textContent = "Calling /api/status...";
                try {
                    const res = await fetch("/api/status");
                    if (!res.ok) {
                        throw new Error("HTTP " + res.status);
                    }
                    const data = await res.json();
                    output.textContent = JSON.stringify(data, null, 2);
                } catch (err) {
                    output.textContent = "Error calling /api/status: " + err.message;
                }
            }
            document.getElementById("btnStatus").addEventListener("click", callStatus);

            async function createMonthly() {
                output.textContent = "Creating Monthly playlist";
                try {
                    const res = await fetch("/api/playlists/monthly", {
                        method: "POST",
                    });
                    if (!res.ok) {
                        throw new Error("HTTP " + res.status);
                    }
                    const data = await res.json();
                    output.textContent = JSON.stringify(data, null, 2);
                } catch (err) {
                    output.textContent = "Error creating monthly playlist: " + err.message;
                }
            }
            document.getElementById("btnMonthly").addEventListener("click", createMonthly);

            async function loginWithSpotify() {
                output.textContent = "Opening Spotify login (if needed)..."
                try {
                    const res = await fetch("/api/login", {
                        method: "POST",
                    });
                    if (!res.ok) {
                        throw new Error("HTTP " + res.status);
                    }
                    const data = await res.json();
                    output.textContent = JSON.stringify(data, null, 2);
                } catch (err) {
                    output.textContent = "Error during login: " + err.message;
                }
            }
            document.getElementById("btnLogin").addEventListener("click", loginWithSpotify);
        </script>
    </body>
</html>
